name: AI Feature Implementation
on:
  issues:
    types: [labeled]
jobs:
  implement-feature:
    if: github.event.label.name == 'ai-feature'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      # Setup Node (your Next.js stack)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      # Install Ollama
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 10
          ollama pull llama3.1:8b
      
      # Install deps & test setup
      - name: Install dependencies
        run: npm ci
      
      # AI Implementation
      - name: Generate Feature Code
        run: |
          ISSUE_TITLE="${{ github.event.issue.title }}"
          ISSUE_BODY="${{ github.event.issue.body }}"
          REPO_FILES=$(find . -name "*.ts" -o -name "*.js" -o -name "*.tsx" | head -10 | xargs cat | head -1000)
          
          cat > prompt.txt << EOF
          Implement this feature request for a Next.js/Supabase project:
          
          Title: $ISSUE_TITLE
          Body: $ISSUE_BODY
          
          Current codebase context:
          $REPO_FILES
          
          Create/modify files with COMPLETE content. Use TypeScript.
          Output EXACTLY in this format (no explanations):
          
          FILE: src/pages/api/[endpoint].ts
          ```typescript
          // full file content here
          ```
          
          EOF
          
          ollama run llama3.1:8b < prompt.txt > ai_changes.txt
          
          # Apply file changes
          awk '
          /FILE:/ { file = substr($0, index($0,$6)); next }
          /```typescript/ { in_content = 1; next }
          /```/ { in_content = 0; next }
          in_content { print > file }
          ' ai_changes.txt
      
      # Run tests
      - name: Run tests
        run: |
          npm test || npm run lint || true
      
      # Commit & Create PR with GitHub CLI
      - name: Create Feature PR
        run: |
          git config user.name "AI Agent"
          git config user.email "ai@${{ github.repository }}.com"
          git add .
          git diff --staged --quiet || git commit -m "feat: ${{ github.event.issue.title }}
          
          Auto-generated from issue #${{ github.event.issue.number }}
          $(git log -1 --pretty=%B)"
          git push origin HEAD:ai-feature-${{ github.event.issue.number }} || true
          
          gh pr create \
            --title "feat: ${{ github.event.issue.title }}" \
            --body "Auto-implemented feature from issue #${{ github.event.issue.number }}
            
            Generated by Ollama AI Agent" \
            --base main \
            --head ai-feature-${{ github.event.issue.number }} \
            --label "ai-generated,feature" \
            --assignee @${{ github.event.issue.user.login }}
